<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title></title>
  <meta name="description" content="" />
  <style>
    :root {
      --bg: #0f172a;
      --card: #111827;
      --muted: #94a3b8;
      --text: #f8fafc;
      --accent: #38bdf8;
      --border: rgba(148, 163, 184, 0.2);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top left, #1e3a8a 0, #0f172a 35%, #020617 100%);
      color: var(--text);
      line-height: 1.6;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .container {
      width: min(1120px, 92%);
      margin: 0 auto;
      padding: 56px 0;
    }

    .hero {
      min-height: auto;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 28px;
      background: rgba(17, 24, 39, 0.78);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
    }

    .hero-cover {
      min-height: 170px;
      background: #9fb4b4;
    }

    .hero-body {
      padding: 0 36px 36px;
    }

    .hero-avatar {
      display: block;
      width: clamp(140px, 20vw, 190px);
      aspect-ratio: 1;
      object-fit: cover;
      border: 6px solid var(--text);
      border-radius: 50%;
      margin-top: calc(clamp(140px, 20vw, 190px) / -3);
      background: var(--text);
    }

    .hero-name-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px;
      margin-top: 22px;
    }

    .hero h1 {
      font-size: clamp(40px, 6vw, 56px);
      line-height: 1.04;
      margin: 0;
      letter-spacing: -0.03em;
    }

    .hero-role {
      margin: 8px 0 0;
      color: #e2e8f0;
      font-size: clamp(22px, 3vw, 30px);
      line-height: 1.25;
    }

    .hero-location {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 18px;
    }

    .hero-summary {
      margin: 26px 0 0;
      max-width: 820px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--muted);
      background: rgba(15, 23, 42, 0.7);
      font-size: 14px;
    }

    h1 {
      font-size: clamp(40px, 7vw, 76px);
      line-height: 1.02;
      margin: 24px 0 20px;
      letter-spacing: -0.05em;
    }

    .hero-summary,
    .hero p {
      font-size: 20px;
      color: #cbd5e1;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 32px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 13px 18px;
      border-radius: 14px;
      font-weight: 700;
      border: 1px solid var(--border);
    }

    .button.primary {
      background: var(--accent);
      color: #020617;
      border-color: transparent;
    }

    .button.secondary {
      color: var(--text);
      background: rgba(15, 23, 42, 0.65);
    }

    section {
      margin-top: 72px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 24px;
      margin-bottom: 24px;
    }

    .section-header h2 {
      font-size: 34px;
      margin: 0;
      letter-spacing: -0.03em;
    }

    .section-header p {
      color: var(--muted);
      margin: 0;
      max-width: 620px;
    }

    .apps-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 22px;
    }

    .apps-grid.loading,
    .apps-grid.empty {
      grid-template-columns: 1fr;
    }

    .app-card {
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border);
      background: rgba(17, 24, 39, 0.82);
      border-radius: 24px;
      padding: 24px;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .app-card:hover {
      transform: translateY(-4px);
      border-color: rgba(56, 189, 248, 0.55);
    }

    .app-top {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }

    .app-card h3 {
      margin: 0;
      font-size: 24px;
    }

    .tag {
      white-space: nowrap;
      font-size: 13px;
      color: #bae6fd;
      border: 1px solid rgba(56, 189, 248, 0.35);
      padding: 5px 10px;
      border-radius: 999px;
      height: fit-content;
    }

    .app-card p {
      color: #cbd5e1;
    }

    .app-image {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      border-radius: 14px;
      border: 1px solid var(--border);
      margin-bottom: 18px;
      background: rgba(15, 23, 42, 0.9);
    }

    .app-status {
      border: 1px solid var(--border);
      background: rgba(17, 24, 39, 0.82);
      border-radius: 20px;
      color: var(--muted);
      padding: 24px;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 18px 0;
    }

    .app-links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: auto;
      padding-top: 6px;
    }

    .pill {
      font-size: 13px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--border);
      color: #cbd5e1;
    }

    .skills {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .skill-card {
      border: 1px solid var(--border);
      background: rgba(17, 24, 39, 0.7);
      border-radius: 20px;
      padding: 20px;
    }

    .skill-card h3 {
      margin-top: 0;
      font-size: 18px;
    }

    .skill-card p {
      color: var(--muted);
      margin-bottom: 0;
      font-size: 15px;
    }

    .contact {
      border: 1px solid var(--border);
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.16), rgba(17, 24, 39, 0.8));
      border-radius: 28px;
      padding: 36px;
      display: flex;
      justify-content: space-between;
      gap: 24px;
      align-items: center;
    }

    footer {
      color: var(--muted);
      padding: 32px 0 48px;
      text-align: center;
      font-size: 14px;
    }

    @media (max-width: 820px) {
      .apps-grid,
      .skills,
      .contact {
        grid-template-columns: 1fr;
      }

      .hero {
        border-radius: 22px;
      }

      .hero-cover {
        min-height: 150px;
      }

      .hero-body {
        padding: 0 22px 26px;
      }

      .section-header,
      .contact {
        display: block;
      }

      .contact .actions {
        margin-top: 20px;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="hero" id="hero" aria-live="polite">
    </section>

    <section id="apps">
      <div class="section-header">
        <h2 id="projects-title"></h2>
        <p id="projects-summary"></p>
      </div>

      <div class="apps-grid loading" id="projects-grid" aria-live="polite">
      </div>
    </section>

    <section id="skills">
      <div class="section-header">
        <h2 id="skills-title"></h2>
        <p id="skills-summary"></p>
      </div>

      <div class="skills" id="skills-grid" aria-live="polite">
      </div>
    </section>

    <section class="contact" id="contact">
    </section>
  </main>

  <footer id="footer">
  </footer>

  <script>
    const heroSection = document.getElementById('hero');
    const projectsTitle = document.getElementById('projects-title');
    const projectsSummary = document.getElementById('projects-summary');
    const projectsGrid = document.getElementById('projects-grid');
    const skillsTitle = document.getElementById('skills-title');
    const skillsSummary = document.getElementById('skills-summary');
    const skillsGrid = document.getElementById('skills-grid');
    const contactSection = document.getElementById('contact');
    const footer = document.getElementById('footer');
    let siteContent;

    const createElement = (tag, className, text) => {
      const element = document.createElement(tag);
      if (className) {
        element.className = className;
      }
      if (text) {
        element.textContent = text;
      }
      return element;
    };

    const normalizeUrls = (project) => {
      if (Array.isArray(project.urls)) {
        return project.urls;
      }

      return [];
    };

    const applyMeta = (content) => {
      document.title = content.title;
      document.querySelector('meta[name="description"]').content = content.description;
    };

    const renderActions = (actions) => {
      const actionsContainer = createElement('div', 'actions');

      actions.forEach((action) => {
        const link = createElement('a', `button ${action.variant || 'secondary'}`, action.label);
        link.href = action.href;

        if (action.external) {
          link.target = '_blank';
          link.rel = 'noreferrer';
        }

        actionsContainer.appendChild(link);
      });

      return actionsContainer;
    };

    const renderHero = (content) => {
      const cover = createElement('div', 'hero-cover');
      cover.style.background = content.coverColor;

      const body = createElement('div', 'hero-body');

      const avatar = createElement('img', 'hero-avatar');
      avatar.src = content.profileImage;
      avatar.alt = content.profileImageAlt;
      body.appendChild(avatar);

      const nameRow = createElement('div', 'hero-name-row');
      nameRow.appendChild(createElement('h1', '', content.name));
      body.appendChild(nameRow);

      body.appendChild(createElement('p', 'hero-role', content.role));
      body.appendChild(createElement('p', 'hero-location', content.location));
      body.appendChild(createElement('p', 'hero-summary', content.summary));
      body.appendChild(renderActions(content.actions || []));

      heroSection.replaceChildren(cover, body);
    };

    const renderProjectsHeader = (content) => {
      projectsTitle.textContent = content.title;
      projectsSummary.textContent = content.summary || '';

      if (!projectsGrid.childElementCount && content.loading) {
        projectsGrid.appendChild(createElement('p', 'app-status', content.loading));
      }
    };

    const renderSkills = (content) => {
      skillsTitle.textContent = content.title;
      skillsSummary.textContent = content.summary;
      skillsSummary.hidden = !content.summary;
      skillsGrid.replaceChildren();

      content.items.forEach((skill) => {
        const card = createElement('div', 'skill-card');
        card.appendChild(createElement('h3', '', skill.title));
        card.appendChild(createElement('p', '', skill.summary));
        skillsGrid.appendChild(card);
      });
    };

    const renderContact = (content) => {
      const copy = createElement('div');
      copy.appendChild(createElement('h2', '', content.title));
      copy.appendChild(createElement('p', '', content.summary));

      contactSection.replaceChildren(copy, renderActions(content.actions || []));
    };

    const renderFooter = (content) => {
      footer.textContent = content.template
        .replace('{year}', new Date().getFullYear())
        .replace('{owner}', content.owner)
        .replace('{suffix}', content.suffix);
    };

    const loadSiteContent = async () => {
      try {
        const response = await fetch('user/site.json', { cache: 'no-store' });

        if (!response.ok) {
          throw new Error(`Site content failed with ${response.status}`);
        }

        const content = await response.json();
        siteContent = content;
        applyMeta(content.meta);
        renderHero(content.hero);
        renderProjectsHeader(content.projects);
        renderSkills(content.coreSkills);
        renderContact(content.contact);
        renderFooter(content.footer);
      } catch (error) {
        console.error(error);
      }
    };

    const normalizeProject = (project, slug) => ({
      slug,
      title: project.title,
      summary: project.summary,
      techStack: project.techStack || project['tech-stack'] || [],
      urls: normalizeUrls(project),
      category: project.category,
      image: project.image
    });

    const getGitHubPagesRepository = () => {
      const hostParts = window.location.hostname.split('.');

      if (hostParts.length < 3 || hostParts.slice(-2).join('.') !== 'github.io') {
        return null;
      }

      const owner = hostParts[0];
      return {
        owner,
        repo: `${owner}.github.io`
      };
    };

    const getFirstGitHubImage = async (apiBaseUrl, slug) => {
      try {
        const response = await fetch(`${apiBaseUrl}/projects/${slug}/images`, { cache: 'no-store' });

        if (!response.ok) {
          return undefined;
        }

        const files = await response.json();
        const image = files
          .filter((file) => file.type === 'file' && /\.(avif|gif|jpe?g|png|webp)$/i.test(file.name))
          .sort((a, b) => a.name.localeCompare(b.name))[0];

        return image ? `projects/${slug}/images/${image.name}` : undefined;
      } catch (error) {
        console.warn(`Project image lookup failed for ${slug}`, error);
        return undefined;
      }
    };

    const loadProjectsFromGitHub = async () => {
      const repository = getGitHubPagesRepository();

      if (!repository) {
        return null;
      }

      const apiBaseUrl = `https://api.github.com/repos/${repository.owner}/${repository.repo}/contents`;
      const response = await fetch(`${apiBaseUrl}/projects`, { cache: 'no-store' });

      if (!response.ok) {
        throw new Error(`GitHub project lookup failed with ${response.status}`);
      }

      const entries = await response.json();
      const projectDirectories = entries
        .filter((entry) => entry.type === 'dir')
        .map((entry) => entry.name)
        .sort((a, b) => a.localeCompare(b));

      return Promise.all(projectDirectories.map(async (slug) => {
        const descriptionResponse = await fetch(`projects/${slug}/description.json`, { cache: 'no-store' });

        if (!descriptionResponse.ok) {
          throw new Error(`Project description failed for ${slug}`);
        }

        const description = await descriptionResponse.json();
        const image = description.image || await getFirstGitHubImage(apiBaseUrl, slug);

        return normalizeProject({ ...description, image }, slug);
      }));
    };

    const loadProjectsFromManifest = async () => {
      const response = await fetch('projects/manifest.json', { cache: 'no-store' });

      if (!response.ok) {
        throw new Error(`Project manifest failed with ${response.status}`);
      }

      return response.json();
    };

    const loadProjects = async () => {
      try {
        return await loadProjectsFromGitHub() || await loadProjectsFromManifest();
      } catch (error) {
        console.warn(error);
        return loadProjectsFromManifest();
      }
    };

    const renderProject = (project) => {
      const card = createElement('article', 'app-card');

      if (project.image) {
        const image = createElement('img', 'app-image');
        image.src = project.image;
        image.alt = `${project.title} preview`;
        image.loading = 'lazy';
        card.appendChild(image);
      }

      const top = createElement('div', 'app-top');
      top.appendChild(createElement('h3', '', project.title));

      if (project.category) {
        top.appendChild(createElement('span', 'tag', project.category));
      }

      card.appendChild(top);
      card.appendChild(createElement('p', '', project.summary));

      const meta = createElement('div', 'meta');
      project.techStack.forEach((tech) => {
        meta.appendChild(createElement('span', 'pill', tech));
      });
      card.appendChild(meta);

      if (project.urls.length) {
        const links = createElement('div', 'app-links');

        project.urls.forEach((url) => {
          const link = createElement('a', '', url.cta);
          link.href = url.link;
          link.target = '_blank';
          link.rel = 'noreferrer';
          links.appendChild(link);
        });

        card.appendChild(links);
      }

      return card;
    };

    const renderProjects = async () => {
      try {
        const projects = await loadProjects();
        projectsGrid.replaceChildren();
        projectsGrid.classList.remove('loading', 'empty');

        if (!projects.length) {
          projectsGrid.classList.add('empty');
          projectsGrid.appendChild(createElement('p', 'app-status', siteContent.projects.empty));
          return;
        }

        projects.forEach((project) => {
          projectsGrid.appendChild(renderProject(project));
        });
      } catch (error) {
        projectsGrid.classList.remove('loading');
        projectsGrid.classList.add('empty');
        projectsGrid.replaceChildren(createElement('p', 'app-status', siteContent.projects.error));
        console.error(error);
      }
    };

    const initialize = async () => {
      await loadSiteContent();
      renderProjects();
    };

    initialize();
  </script>
</body>
</html>
